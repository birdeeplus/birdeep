tags:
  - name: Processors
    description: Operations related to processors in the BIRDeep database

paths:
  /api/v1/processors:
    post:
      tags:
        - Processors
      summary: Insert new processor
      description: Creates a new record in the processors table
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name_processor:
                  type: string
                model_processor:
                  type: string
                comment_processor:
                  type: string
              example:
                name_processor: "Name processor"
                model_processor: "Raspberry Zero"
                comment_processor: "Esto es una prueba"
      responses:
        "200":
          description: Processor created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

    get:
      tags:
        - Processors
      summary: Query processors
      description: Retrieve processor records from the database
      parameters:
        - name: id_processor
          in: query
          schema:
            type: integer
        - name: name_processor
          in: query
          schema:
            type: string
        - name: model_processor
          in: query
          schema:
            type: string
        - name: comment_processor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Array of processors in query
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/v1/processors/{id_processor}:
    put:
      tags:
        - Processors
      summary: Update a processor record
      description: Update a specific processor entry by ID
      parameters:
        - name: id_processor
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name_processor:
                  type: string
                model_processor:
                  type: string
                comment_processor:
                  type: string
              example:
                name_processor: "Updated Processor"
                model_processor: "Orange Pi"
                comment_processor: "Esto es una prueba de actualización del procesador"
      responses:
        "200":
          description: Processor record updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

    delete:
      tags:
        - Processors
      summary: Delete a processor record
      description: Delete a processor record from the database by ID
      parameters:
        - name: id_processor
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Processor record deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
