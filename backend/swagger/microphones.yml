tags:
  - name: Microphones
    description: Operations related to microphones in the BIRDeep database

paths:
  /api/v1/microphones:
    post:
      tags:
        - Microphones
      summary: Insert new microphone
      description: Creates a new record in the microphones table
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name_microphone:
                  type: string
                model_microphone:
                  type: string
                comment_microphone:
                  type: string
              example:
                name_microphone: "Name microphone"
                model_microphone: "Rode"
                comment_microphone: "Esto es una prueba de creacion"
      responses:
        "200":
          description: Microphone created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

    get:
      tags:
        - Microphones
      summary: Query microphones
      description: Retrieve microphone records from the database
      parameters:
        - name: id_microphone
          in: query
          schema:
            type: integer
        - name: name_microphone
          in: query
          schema:
            type: string
        - name: model_microphone
          in: query
          schema:
            type: string
        - name: comment_microphone
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Array of microphones in query
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/v1/microphones/{id_microphone}:
    put:
      tags:
        - Microphones
      summary: Update a microphone record
      description: Update a specific microphone entry by ID
      parameters:
        - name: id_microphone
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name_microphone:
                  type: string
                model_microphone:
                  type: string
                comment_microphone:
                  type: string
              example:
                name_microphone: "Other name"
                model_microphone: "Senheisser"
                comment_microphone: "Esto es una prueba de actualizacion"
      responses:
        "200":
          description: Microphone record updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

    delete:
      tags:
        - Microphones
      summary: Delete a microphone record
      description: Delete a microphone record from the database by ID
      parameters:
        - name: id_microphone
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Microphone record deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
