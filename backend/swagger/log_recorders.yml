tags:
  - name: Log_Recorder
    description: Operations related to log recorders

paths:
  /insert_status:
    post:
      tags:
        - Log_Recorder
      summary: Insert new status of recorder in database
      description: This function creates a new record in table log_recorder from BIRDeep database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id_recorder:
                  type: integer
                time_log:
                  type: string
                  format: date-time
                temperature_log:
                  type: integer
              example:
                id_recorder: 1
                time_log: "2000-12-01T00:00:00"
                temperature_log: 30
      responses:
        "200":
          description: Log created in database
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
