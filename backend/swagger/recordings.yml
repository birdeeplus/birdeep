tags:
  - name: Recordings
    description: Operations related to recordings in the BIRDeep database

paths:
  /api/v1/recordings:
    post:
      tags:
        - Recordings
      summary: Insert new recording
      description: Creates a new record in the recordings table
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id_recorder:
                  type: integer
                time:
                  type: string
                  format: date-time
                filetype:
                  type: string
                bitrate:
                  type: integer
                sample_rate:
                  type: string
                gain:
                  type: number
                duration:
                  type: integer
                uri:
                  type: string
                device:
                  type: string
              example:
                id_recorder: 1
                time: "2000-12-1T00:00:00Z"
                filetype: "mp4"
                bitrate: 192
                sample_rate: "1.5"
                gain: 0.5
                duration: 2
                uri: "URI_FALSA"
                device: "TEST"
      responses:
        "200":
          description: Recording created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

    get:
      tags:
        - Recordings
      summary: Query recordings
      description: Retrieve recording records from the database
      parameters:
        - name: id_record
          in: query
          schema:
            type: integer
        - name: id_recorder_recordings
          in: query
          schema:
            type: integer
        - name: time_record
          in: query
          schema:
            type: string
            format: date-time
        - name: filetype_record
          in: query
          schema:
            type: string
        - name: bitrate_record
          in: query
          schema:
            type: integer
        - name: sample_rate_record
          in: query
          schema:
            type: string
        - name: gain_record
          in: query
          schema:
            type: number
        - name: duration_record
          in: query
          schema:
            type: integer
        - name: uri
          in: query
          schema:
            type: string
        - name: device
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Array of recordings in query
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/v1/recordings/{id_record}:
    put:
      tags:
        - Recordings
      summary: Update a recording record
      description: Update a specific recording entry by ID
      parameters:
        - name: id_record
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id_recorder:
                  type: integer
                time:
                  type: string
                  format: date-time
                filetype:
                  type: string
                bitrate:
                  type: integer
                sample_rate:
                  type: string
                gain:
                  type: number
                duration:
                  type: integer
                uri:
                  type: string
                device:
                  type: string
              example:
                id_recorder: 1
                time: "2000-12-1T00:00:00Z"
                filetype: "mp4"
                bitrate: 192
                sample_rate: "1.5"
                gain: 0.5
                duration: 2
                uri: "uri_actualizada"
                device: "dispositivo_actualizado"
      responses:
        "200":
          description: Recording record updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

    delete:
      tags:
        - Recordings
      summary: Delete a recording record
      description: Delete a recording record from the database by ID
      parameters:
        - name: id_record
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Recording record deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

    get:
        tags:
          - Recording
        summary: Recording by id
        description: Retrieve recording records from the database
        parameters:
          - name: id_record
            in: query
            schema:
              type: integer
          - name: id_recorder_recordings
            in: query
            schema:
              type: integer
          - name: time_record
            in: query
            schema:
              type: string
              format: date-time
          - name: filetype_record
            in: query
            schema:
              type: string
          - name: bitrate_record
            in: query
            schema:
              type: integer
          - name: sample_rate_record
            in: query
            schema:
              type: string
          - name: gain_record
            in: query
            schema:
              type: number
          - name: duration_record
            in: query
            schema:
              type: integer
          - name: uri
            in: query
            schema:
              type: string
          - name: device
            in: query
            schema:
              type: string
        responses:
          "200":
            description: A recording by id
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    message:
                      type: string
